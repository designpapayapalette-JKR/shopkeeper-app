name: Build APK (Shopkeeper App)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --no-install

      - name: Raise Gradle/Kotlin daemon memory limits
        # GRADLE_OPTS alone doesn't reach the Kotlin compile daemon that runs
        # kspReleaseKotlin (expo-updates) — it needs org.gradle.jvmargs /
        # kotlin.daemon.jvmargs set directly in gradle.properties. The 1536m
        # cap still OOM'd after ~13min into kspReleaseKotlin, so this raises
        # it further and serializes workers (max=1) so only one heavy JVM
        # holds memory at a time instead of several competing for Metaspace.
        # ksp.incremental=false avoids the incremental-cache growth that's a
        # known contributor to KSP metaspace bloat on cold CI runners.
        run: |
          free -h
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=3g"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=3g"
            echo "org.gradle.workers.max=2"
            echo "ksp.incremental=false"
          } >> android/gradle.properties

      - name: Build release APK
        # lintVitalRelease/lintVitalAnalyzeRelease was the actual bottleneck
        # on the last run — kspReleaseKotlin succeeded with the raised memory
        # limits above and the build sailed through native/dex/resources in
        # ~35min, then sat for the remaining hour stuck on lint-vital
        # analysis serialized to one worker. Lint isn't needed to produce an
        # installable APK (this isn't a Play Store submission), so skip it.
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: https://api.managemycounter.com
          # beta-latest must remain compatible with the certificate used by
          # existing direct-download installations. Move the production track
          # to a managed release keystore before publishing to an app store.
          ALLOW_DEBUG_RELEASE_SIGNING: "true"
        run: ./gradlew assembleRelease --no-daemon -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintReportRelease

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk shopkeeper-app-latest.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-app-apk
          path: shopkeeper-app-latest.apk

      - name: Upload to existing release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload beta-latest shopkeeper-app-latest.apk --clobber
