name: Build APK (Shopkeeper App)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild (generate android/ folder)
        run: npx expo prebuild --platform android --no-install

      - name: Raise Gradle/Kotlin daemon memory limits
        # GRADLE_OPTS alone doesn't reach the Kotlin compile daemon that runs
        # kspReleaseKotlin (expo-updates) — it needs org.gradle.jvmargs /
        # kotlin.daemon.jvmargs set directly in gradle.properties, which is
        # what was actually causing the Metaspace OOM here. Also cap worker
        # parallelism so concurrent JVMs don't exhaust the runner's RAM.
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m"
            echo "kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: https://api.managemycounter.com
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk shopkeeper-app-latest.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopkeeper-app-apk
          path: shopkeeper-app-latest.apk

      - name: Upload to existing release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload beta-latest shopkeeper-app-latest.apk --clobber
