name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native code
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: https://api.managemycounter.com

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g
          EXPO_PUBLIC_API_URL: https://api.managemycounter.com
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shopkeeper-app-latest.apk

      - name: Upload APK to beta-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload beta-latest shopkeeper-app-latest.apk --clobber
